name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
      - name: Check bundle size
        run: |
          INITIAL_SIZE=$(du -sk dist/assets/*.js | awk '{sum+=$1} END {print sum}')
          echo "Initial bundle size: ${INITIAL_SIZE} KB"
          if [ "$INITIAL_SIZE" -gt 256000 ]; then
            echo "::error::Bundle size ${INITIAL_SIZE} KB exceeds 256000 KB budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
